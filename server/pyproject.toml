[project]
name = "grpc-sim-server"
version = "0.1.0"
description = "gRPC simulation server for the gRPC demo (Android sensing device + simulated environment)"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"